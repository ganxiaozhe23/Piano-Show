[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-show"
version = "0.1.0"
description = "Compile MIDI and images into Minecraft piano pixel-art show packages"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "mido>=1.3"
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
test = ["pytest>=8.0"]

[project.scripts]
piano-show = "piano_show.cli:main"

[tool.setuptools.package-data]
piano_show = ["web/*.html", "web/*.css", "web/*.js", "web/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
